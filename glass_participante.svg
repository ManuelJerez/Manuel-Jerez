<svg xmlns="http://www.w3.org/2000/svg" width="400" height="96" viewBox="0 0 400 96">
  <defs>
    <clipPath id="c"><rect x="2" y="2" width="396" height="92" rx="46"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
      <animate attributeName="x1" values="-400;400" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;800" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.44" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#FFD75A"/>
      <stop offset="0.56" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 600 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#c)">
    <rect width="400" height="96" fill="#0b1638" fill-opacity="0.55"/>
    <g filter="url(#blur)">
      <circle cx="80" cy="70" r="50" fill="#1e4fd1" opacity="0.8">
        <animate attributeName="cx" values="60;220;60" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;30;70" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="20" r="40" fill="#F5B800" opacity="0.4">
        <animate attributeName="cx" values="340;200;340" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="20;75;20" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="60" r="34" fill="#7b5cff" opacity="0.35">
        <animate attributeName="cx" values="250;370;250" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="400" height="96" fill="url(#frost)"/>
    <rect x="-140" y="-10" width="70" height="120" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" values="-140;520" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <g fill="#fff">
      <circle cx="300" cy="22" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="355" cy="66" r="1"><animate attributeName="opacity" values="1;0;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="245" cy="76" r="0.9"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="372" cy="34" r="1.1"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="2.5" y="2.5" width="395" height="91" rx="45.5" fill="none" stroke="url(#edge)" stroke-width="1"/>

  <!-- punto en vivo con órbita -->
  <circle cx="44" cy="48" r="5" fill="#F5B800" opacity="0.4">
    <animate attributeName="r" values="5;13;5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="48" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="44" cy="48" r="5" fill="#F5B800"/>
  <g>
    <circle cx="57" cy="48" r="1.8" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="rotate" from="0 44 48" to="360 44 48" dur="3s" repeatCount="indefinite"/>
  </g>

  <text x="72" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" letter-spacing="2.4" fill="#ffffff" fill-opacity="0.6">NASA SPACE APPS · COCHABAMBA 2026</text>
  <text x="71" y="67" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="url(#txt)">Participante</text>
</svg>
